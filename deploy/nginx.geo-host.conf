# 範例：加進 GEO-Saas/nginx/nginx.conf 的 http { } 內（定案前不要套用）
#
# 憑證要分兩次加，否則 nginx 會因為找不到憑證而啟動失敗，連 GEO 一起停掉：
#   1. 先只加 80 的 server，reload 後執行
#      certbot certonly --webroot -w ./certbot/www -d yujun.example.com -d www.yujun.example.com
#   2. 拿到憑證後再加 443 的 server
# 每次 reload 前先跑 docker exec geo_nginx nginx -t

upstream yujun_web {
    server yujun_web:3000;
}

server {
    listen 80;
    server_name yujun.example.com www.yujun.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name yujun.example.com www.yujun.example.com;

    ssl_certificate     /etc/letsencrypt/live/yujun.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yujun.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 只給 GEO 後端從 docker 內網呼叫（http://yujun_web:3000/api/revalidate/），外部一律擋掉
    location /api/ {
        return 404;
    }

    location / {
        proxy_pass http://yujun_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
