# 範例：獨立 VM 的 nginx.conf。憑證同樣要先用 80 申請，再加 443 的 server
events {
    worker_connections 1024;
}

http {
    upstream web {
        server web:3000;
    }

    server {
        listen 80;
        server_name yujun.example.com www.yujun.example.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name yujun.example.com www.yujun.example.com;

        ssl_certificate     /etc/letsencrypt/live/yujun.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yujun.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # /api/revalidate/ 要讓 GEO 從外部呼叫，由 REVALIDATE_SECRET 把關；其他 /api/ 不開放
        location = /api/revalidate/ {
            proxy_pass http://web;
            proxy_set_header Host $host;
        }

        location /api/ {
            return 404;
        }

        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
